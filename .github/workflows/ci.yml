name: CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      suite:
        description: Bun test suite
        type: choice
        default: smoke
        options:
          - smoke
          - all
          - runtime
          - integrations
          - mcp
          - skills
          - shell
          - providers
          - sessions
          - editor
          - notifications
          - auth
          - updates
          - ui
          - core
      browsers:
        description: Also run all Chromium and WebKit tests
        type: boolean
        default: false

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # Keeps CI on the same Bun a release runs on
      - name: Read the pinned Bun version
        id: pins
        run: echo "bun=$(jq -r .bun versions.json)" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.pins.outputs.bun }}

      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - name: Run selected Bun tests
        env:
          TEST_SUITE: ${{ inputs.suite || 'smoke' }}
        run: bun run tests "$TEST_SUITE"
      - run: bun run build
      - name: Install browser dependencies
        if: github.event_name == 'workflow_dispatch' && inputs.browsers
        run: bun x playwright install --with-deps chromium webkit
      - name: Run browser tests
        if: github.event_name == 'workflow_dispatch' && inputs.browsers
        run: bun run test:browser
      - name: Upload browser failure artifacts
        if: failure() && github.event_name == 'workflow_dispatch' && inputs.browsers
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: test-results/
          if-no-files-found: ignore

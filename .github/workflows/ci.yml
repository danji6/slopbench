name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # Keeps CI on the same Bun a release runs on
      - name: Read the pinned Bun version
        id: pins
        run: echo "bun=$(jq -r .bun versions.json)" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.pins.outputs.bun }}

      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      - name: Install browser dependencies
        run: bun x playwright install --with-deps chromium webkit
      - run: bun run test:browser
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: test-results/
          if-no-files-found: ignore
